name: E2E tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    playwright:
        name: Playwright (Storybook)
        runs-on: ubuntu-latest
        # The suite builds Storybook, serves it, and runs 215 tests; locally the
        # whole thing lands around 3 minutes. The ceiling is generous so a slow
        # runner reports failures rather than a timeout.
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v2

            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              working-directory: frontend
              run: pnpm install --frozen-lockfile

            # Chromium only: `playwright.config.ts` declares a single chromium
            # project, so installing the other browsers would just add minutes.
            - name: Install Playwright Chromium
              working-directory: frontend
              run: pnpm exec playwright install --with-deps chromium

            # `webServer` in playwright.config.ts builds Storybook and serves
            # the output, so there is no separate build step here. It runs
            # against the BUILT Storybook rather than `storybook dev` on
            # purpose: measured 2026-09-23, three runs each, the dev server
            # produced 16/38/12 failures with 41 tests nondeterministic while
            # the built output produced 7/7/7 with none. A suite that flaps
            # teaches people to re-run it instead of reading it.
            - name: Run e2e tests
              working-directory: frontend
              run: pnpm test:e2e

            - name: Upload report on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: frontend/playwright-report/
                  retention-days: 7
