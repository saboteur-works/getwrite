<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>localStorage persistence check (Feature 95, FR-34)</title>
    <style>
      body {
        font:
          16px/1.8 system-ui,
          sans-serif;
        margin: 1.5rem;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
      }
      button {
        font-size: 1rem;
        padding: 0.75rem 1rem;
        margin: 0.5rem 0.5rem 0.5rem 0;
      }
    </style>
  </head>
  <body>
    <h1>localStorage persistence check</h1>
    <p>Origin: <code id="origin"></code></p>
    <pre id="out"></pre>
    <button id="write">Write a new value</button>
    <button id="reload">Reload page</button>
    <a href="index.html">Back to menu</a>
    <script>
      var KEY = "spell-spike-storage-check";
      var out = document.getElementById("out");
      document.getElementById("origin").textContent = location.origin;
      function render() {
        var v = null;
        var err = null;
        try {
          v = localStorage.getItem(KEY);
        } catch (e) {
          err = String(e);
        }
        out.textContent =
          "key: " +
          KEY +
          "\nvalue: " +
          (err ? "ERROR " + err : v === null ? "(absent)" : v) +
          "\nread at: " +
          new Date().toISOString();
      }
      document.getElementById("write").onclick = function () {
        try {
          localStorage.setItem(KEY, "written " + new Date().toISOString());
        } catch (e) {
          out.textContent = "write failed: " + String(e);
          return;
        }
        render();
      };
      document.getElementById("reload").onclick = function () {
        location.reload();
      };
      render();
    </script>
  </body>
</html>
